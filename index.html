<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鬍子泳隊｜隊史紀錄資料庫</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#102033;--muted:#66758a;--line:#e4e9f0;--accent:#087ea4;--accent2:#075985;--gold:#c58b16;--danger:#b42318;--ok:#16794c;--shadow:0 10px 30px rgba(18,38,63,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
header{background:linear-gradient(135deg,#062f45,#087ea4);color:#fff;padding:24px 18px;position:sticky;top:0;z-index:5;box-shadow:0 5px 18px #0002}
.top{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-weight:900;font-size:22px}.sub{opacity:.78;font-size:12px;margin-top:3px}
button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}.btn{background:#fff;color:#075985}.btn.primary{background:var(--accent);color:#fff}.btn.ghost{background:#eef7fa;color:#075985}.btn.danger{background:#fff0ef;color:var(--danger)}.btn.small-btn{padding:4px 8px;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:24px 16px 60px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end;margin:8px 0 22px}.hero h1{font-size:34px;margin:0}.hero p{color:var(--muted);margin:8px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tab{background:#e9eef4;color:#43556b}.tab.active{background:#102f43;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.record-card{position:relative}

.record-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.record-item-title{font-size:26px;font-weight:900;color:var(--accent2);line-height:1.1;}
.meet-badge{background:#eef7fa;color:#075985;border:1px solid #bce2ef;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700;display:inline-block;}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f4f7fa;color:#52657a;font-size:13px}td strong{font-size:18px}
.searchbar{display:flex;gap:10px;margin:15px 0}.searchbar input{flex:1}.input,select{border:1px solid #d7dee8;background:#fff;border-radius:11px;padding:10px 12px;width:100%}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.person{cursor:pointer}.person:hover{transform:translateY(-2px)}.person h3{margin:0 0 6px}.muted{color:var(--muted)}.stat{font-size:26px;font-weight:900}
.view{display:none}.view.active{display:block}.empty{padding:35px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#071624aa;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;max-width:620px;width:100%;padding:22px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.notice{padding:12px;border-radius:12px;background:#eef8fb;color:#075985;margin:10px 0}.error{background:#fff0ef;color:var(--danger)}.success{background:#ecfdf3;color:var(--ok)}
.admin{display:none}.admin.show{display:block}.small{font-size:12px}.record-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.section-title{font-size:20px;margin:24px 0 12px;display:flex;align-items:center;gap:8px;font-weight:800}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.people{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{display:block}.hero h1{font-size:28px}.grid,.people{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:18px}header{position:relative}}
</style>
</head>
<body>
<header><div class="top">
<div><div class="brand">🏊 鬍子泳隊｜隊史紀錄資料庫</div><div class="sub">公開查詢 · 教練管理 · PB / 隊史自動判定</div></div>
<div id="authArea"><button class="btn" onclick="openLogin()">教練登入</button></div>
</div></header>
<main>
<section class="hero"><div><h1>🏆 隊史紀錄</h1><p>每一秒都值得被記住。速度會變，紀錄會留下。</p></div><div id="dbStatus" class="muted small"></div></section>
<div class="tabs"><button class="tab active" data-course="長池">長池 50m</button><button class="tab" data-course="短池">短池 25m</button></div>

<div id="recordsView"></div>

<section style="margin-top:34px"><div class="hero"><div><h2>👥 隊員資料庫</h2><p>點選有比賽紀錄的隊員查看個人最佳紀錄（PB）與隊史保持項目。</p></div></div>
<div class="searchbar"><input id="search" class="input" placeholder="搜尋姓名、學校…"></div><div id="people" class="people"></div></section>

<section id="adminPanel" class="admin" style="margin-top:40px">
<div class="hero">
  <div><h2>🔐 教練後台</h2><p>登入後新增成績，系統會自動更新 PB 與隊史判定。</p></div>
  <div style="display:flex;gap:8px">
    <button class="btn ghost" onclick="exportCSV()">📥 匯出 CSV (Excel)</button>
    <button class="btn primary" onclick="openPerformanceModal()">＋ 新增/修改成績</button>
  </div>
</div>
<div class="grid">
<div class="card"><div class="muted">隊員</div><div class="stat" id="statPeople">—</div></div>
<div class="card"><div class="muted">目前 PB 筆數</div><div class="stat" id="statPB">—</div></div>
<div class="card"><div class="muted">隊史紀錄</div><div class="stat" id="statRecords">—</div></div>
</div>
<div class="card" style="margin-top:14px"><h3>最近更新</h3><div id="recent"></div></div>
</section>
</main>

<div id="loginModal" class="modal" onclick="if(event.target===this)closeModal('loginModal')"><div class="modalbox">
<div class="modalhead"><h2>教練登入</h2><button onclick="closeModal('loginModal')">✕</button></div>
<label style="margin-top:10px;display:block">Email</label><input id="loginEmail" class="input" type="email" placeholder="coach@example.com">
<label style="display:block;margin-top:10px">密碼</label><input id="loginPassword" class="input" type="password">
<div id="loginMsg"></div><button class="btn primary" style="margin-top:14px;width:100%" onclick="login()">登入</button>
</div></div>

<div id="personModal" class="modal" onclick="if(event.target===this)closeModal('personModal')"><div class="modalbox"><div class="modalhead"><h2 id="personTitle">隊員</h2><button onclick="closeModal('personModal')">✕</button></div><div id="personBody"></div></div></div>

<div id="performanceModal" class="modal" onclick="if(event.target===this)closeModal('performanceModal')"><div class="modalbox">
<div class="modalhead"><h2 id="perfModalTitle">新增 / 修改成績</h2><button onclick="closeModal('performanceModal')">✕</button></div>
<div class="formgrid">
<div><label>隊員</label><select id="pSwimmer"></select></div>
<div><label>泳池</label><select id="pCourse"><option>長池</option><option>短池</option></select></div>
<div><label>項目</label><select id="pEvent"></select></div>
<div><label>成績（秒數或 分:秒 如 05:24.60）</label><input id="pSeconds" class="input" placeholder="05:24.60 或 63.74"></div>
<div><label>日期</label><input id="pDate" class="input" type="date"></div>
<div>
  <label>賽事標籤</label>
  <select id="pMeet" onchange="checkNewMeet(this)"></select>
  <input id="pMeetCustom" class="input" style="display:none; margin-top:6px;" placeholder="請輸入新賽事名稱 (例如: 2610中正)">
</div>
<div class="full"><label>備註</label><input id="pNote" class="input" placeholder="可選"></div>
</div>
<div id="pMsg"></div>
<div style="display:flex; gap:10px; margin-top:15px;">
  <button id="deletePerfBtn" class="btn danger" style="display:none; flex:1;" onclick="deletePerformance()">🗑️ 刪除此成績</button>
  <button class="btn primary" style="flex:2;" onclick="submitPerformance()">儲存成績</button>
</div>
</div></div>

<script src="config.js"></script>
<script>
const DEMO_DATA = {"roster":[{"name":"李亮樂","gender":"女","school":"中正國中","grade":"9","birth":"2011/01/14","note":"99尾~100頭"},{"name":"曾子僑","gender":"女","school":"重慶國中","grade":"8","birth":"2011/11/12","note":"100尾~101頭"},{"name":"潘沅駿","gender":"男","school":"土城國中","grade":"8","birth":"2012/04/25","note":null},{"name":"彭奕凱","gender":"男","school":"中山國小","grade":"7","birth":"2012/09/29","note":"101尾~102頭"},{"name":"劉昱成","gender":"男","school":"板橋國小","grade":"7","birth":"2012/11/05","note":null},{"name":"胡庭瑞","gender":"男","school":"中山國小","grade":"6","birth":"2014/05/12","note":"102尾~103頭"},{"name":"陳言安","gender":"男","school":"埔墘國小","grade":"6","birth":"2014/05/14","note":null},{"name":"鍾昊恩","gender":"男","school":"大觀國小","grade":"6","birth":"2014/05/17","note":null},{"name":"張境晏","gender":"女","school":"中山國小","grade":"6","birth":"2014/06/23","note":null},{"name":"曾子瑞","gender":"男","school":"中山國小","grade":"6","birth":"2014/07/16","note":null},{"name":"王柔伊","gender":"女","school":"中山國小","grade":"5","birth":"2015/02/04","note":"103尾~104頭"},{"name":"陳衍均","gender":"男","school":"大觀國小","grade":"5","birth":"2015/02/27","note":null},{"name":"姚家興","gender":"男","school":"中山國小","grade":"5","birth":"2015/03/13","note":null},{"name":"尹亮允","gender":"女","school":"中山國小","grade":"4","birth":"2015/09/29","note":"104尾~105頭"},{"name":"黃惟淵","gender":"男","school":"莒光國小","grade":"4","birth":"2016/01/09","note":null},{"name":"潘昱晴","gender":"女","school":"廣福國小","grade":"4","birth":"2016/01/17","note":null},{"name":"廖書汎","gender":"男","school":"中山國小","grade":"4","birth":"2016/07/11","note":null},{"name":"唐紫芯","gender":"女","school":"裕德國際學校","grade":"4","birth":"2016/08/08","note":null},{"name":"翁晨軒","gender":"男","school":"大觀國小","grade":"3","birth":"2017/01/22","note":"105尾~106頭"},{"name":"楊鎧銓","gender":"男","school":"康橋國際學校","grade":"3","birth":"2017/03/08","note":null},{"name":"高珩晉","gender":"男","school":"康橋國際學校","grade":"3","birth":"2017/08/21","note":null},{"name":"王暐蘅","gender":"男","school":"中山國小","grade":"2","birth":"2017/09/25","note":"106尾~107頭"},{"name":"張可勻","gender":"男","school":"土城國小","grade":"2","birth":"2018/06/21","note":null},{"name":"高赫言","gender":"男","school":"康橋國際學校","grade":"1","birth":"2018/11/13","note":"107尾~108頭"},{"name":"陳廷峰","gender":"男","school":"大觀國中","grade":"9","birth":"2010/12/26","note":null},{"name":"簡歆宸","gender":"女","school":"大觀國小","grade":"5","birth":"2015/05/18","note":null},{"name":"簡歆芸","gender":"女","school":"大觀國小","grade":"2","birth":"2018/05/06","note":null},{"name":"梁義謹","gender":"男","school":"大觀國中","grade":"9","birth":"2011/01/15","note":null},{"name":"吳秉曄","gender":"男","school":"實踐國小","grade":"6","birth":"2013/12/23","note":null},{"name":"王欣蔓","gender":"女","school":"中山國小","grade":"6","birth":null,"note":null},{"name":"邱苡甯","gender":"女","school":null,"grade":"4","birth":null,"note":null},{"name":"邱莛玹","gender":"女","school":null,"grade":"4","birth":null,"note":null},{"name":"林祉妡","gender":null,"school":null,"grade":"4","birth":null,"note":null},{"name":"張可言","gender":"男","school":"土城國中","grade":"7","birth":"2013/01/31","note":null},{"name":"翁唯軒","gender":"男","school":"恆毅中學","grade":"9","birth":"2010/11/04","note":null},{"name":"池永璋","gender":"男","school":"大觀國中","grade":"8","birth":"2012/06/01","note":null},{"name":"洪瑀彤","gender":"女","school":"中山國小","grade":"7","birth":"2012/10/10","note":null},{"name":"王霈晴","gender":"女","school":"中山國小","grade":"7","birth":"2012/10/12","note":null},{"name":"高語均","gender":"女","school":"中山國小","grade":"7","birth":"2013/02/11","note":null},{"name":"鄧宇勝","gender":"男","school":"大觀國小","grade":"7","birth":"2013/05/08","note":null},{"name":"李瑨宸","gender":"男","school":"福瑞斯特高級中學","grade":"4","birth":"2015/11/24","note":null},{"name":"古羽立","gender":"男","school":"康橋國際學校","grade":"3","birth":"2016/11/29","note":null}],"pbs":[],"records":[]};

const EVENT_ORDER = ["50自", "50仰", "50蛙", "50蝶", "100自", "100仰", "100蛙", "100蝶", "200混", "200自", "200蛙", "400自"];
const EVENTS = {
  長池: ["50自", "50仰", "50蛙", "50蝶", "100自", "100仰", "100蛙", "100蝶", "200混", "200自", "200蛙", "400自"],
  短池: ["50自", "50仰", "50蛙", "50蝶", "100自", "100仰", "100蛙", "100蝶", "200混", "200自", "200蛙", "400自"]
};

let state={course:"長池", roster:DEMO_DATA.roster, pbs:[], records:[], rawPerformances:[], user:null, online:false};
let sb=null;

let meetTags = ["2606中正", "2604夢想春季", "2604全國小學", "2601全國北A", "2601新北市中", "2512Xports", "2511夢想冬季", "2509全國北A", "2506全國青年", "2412Xports"];

if(window.SUPABASE_CONFIG?.url && window.SUPABASE_CONFIG?.anonKey && !window.SUPABASE_CONFIG.url.includes("YOUR_")){
  sb=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.anonKey);
  state.online=true;
  sb.auth.getSession().then(({data})=>{state.user=data.session?.user||null; updateAuth(); loadCloud();});
  sb.auth.onAuthStateChange((_e,s)=>{state.user=s?.user||null;updateAuth();loadCloud();});
} else {
  loadCloud();
}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function fmt(sec){
  sec=Number(sec);
  if(!Number.isFinite(sec))return "—";
  if(sec>=60){
    let m=Math.floor(sec/60);
    let s=sec-m*60;
    return String(m).padStart(2,"0")+":"+s.toFixed(2).padStart(5,"0");
  }
  return sec.toFixed(2);
}

function parseSeconds(input) {
  if (typeof input === 'number') return input;
  let str = String(input).trim();
  if (str.includes(':')) {
    let parts = str.split(':');
    let m = parseFloat(parts[0]) || 0;
    let s = parseFloat(parts[1]) || 0;
    return Number((m * 60 + s).toFixed(2));
  }
  return Number(parseFloat(str).toFixed(2));
}

function updateAuth(){
  document.getElementById("authArea").innerHTML=state.user?`<button class="btn" onclick="logout()">登出教練帳號</button>`:`<button class="btn" onclick="openLogin()">教練登入</button>`;
  document.getElementById("adminPanel").classList.toggle("show",!!state.user);
}

function sortRecords(arr){
  return (arr||[]).slice().sort((a,b)=>{
    let ia = EVENT_ORDER.indexOf(a.event);
    let ib = EVENT_ORDER.indexOf(b.event);
    if(ia === -1) ia = 99;
    if(ib === -1) ib = 99;
    return ia - ib;
  });
}

function computeDerivedData(perfList, rosterList) {
  const pbMap = {};
  perfList.forEach(p => {
    const key = `${p.swimmer_name}_${p.course}_${p.event}`;
    if (!pbMap[key] || p.seconds < pbMap[key].seconds) {
      pbMap[key] = { ...p, name: p.swimmer_name };
    }
  });
  state.pbs = Object.values(pbMap);

  const recordMap = {};
  state.pbs.forEach(p => {
    const swimmer = rosterList.find(r => r.name === p.swimmer_name);
    if (!swimmer || !swimmer.gender) return;
    const g = swimmer.gender.includes("女") ? "女" : "男";
    const key = `${p.course}_${g}_${p.event}`;
    if (!recordMap[key] || p.seconds < recordMap[key].seconds) {
      recordMap[key] = {
        course: p.course,
        gender: g,
        event: p.event,
        holder: p.swimmer_name,
        seconds: p.seconds,
        display: fmt(p.seconds),
        meet: p.meet
      };
    }
  });
  state.records = Object.values(recordMap);
}

function render(){
 try {
   const statusEl = document.getElementById("dbStatus");
   if(statusEl) statusEl.textContent=state.online?"☁️ 雲端資料庫模式":"💾 預覽資料模式";
   
   document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.course===state.course));
   
   const currentRecords = (state.records || []).filter(r => r && r.course === state.course);
   
   const maleRecords = sortRecords(currentRecords.filter(r => r.gender && (r.gender.includes("男") || r.gender === "M")));
   const femaleRecords = sortRecords(currentRecords.filter(r => r.gender && (r.gender.includes("女") || r.gender === "F")));

   const renderCard = r => `
     <div class="card record-card">
       <div class="record-top">
         <div class="record-item-title">${esc(r.event)}</div>
         <div class="meet-badge">${esc(r.meet||"")}</div>
       </div>
       <h2 style="margin:6px 0">${esc(r.display||fmt(r.seconds))}</h2>
       <div><b>${esc(r.holder||r.swimmer_name||"")}</b></div>
     </div>`;

   const recordsView = document.getElementById("recordsView");
   if(recordsView) {
     recordsView.innerHTML=`
       <div style="margin-bottom: 30px;">
         <div class="section-title" style="color: var(--accent2);">🏊‍♂️ 隊史紀錄（男）</div>
         <div class="grid">${maleRecords.length ? maleRecords.map(renderCard).join("") : '<div class="empty">尚無紀錄</div>'}</div>
       </div>
       <div>
         <div class="section-title" style="color: var(--danger);">🏊‍♀️ 隊史紀錄（女）</div>
         <div class="grid">${femaleRecords.length ? femaleRecords.map(renderCard).join("") : '<div class="empty">尚無紀錄</div>'}</div>
       </div>
     `;
   }
   renderPeople(); renderAdmin();
 } catch(e) {
   console.error("Render Error:", e);
 }
}

function renderPeople(){
 try {
   const searchEl = document.getElementById("search");
   const q = searchEl ? searchEl.value.trim().toLowerCase() : "";
   
   const pbsList = state.pbs || [];
   const rosterList = state.roster || [];
   const recordsList = state.records || [];
   
   const activeSwimmers = rosterList.filter(p => p.name !== "鄧丞勛" && (pbsList.length === 0 || pbsList.some(x => x.name === p.name || x.swimmer_name === p.name)));
   const arr = activeSwimmers.filter(x => !q || [x.name, x.school].filter(Boolean).join(" ").toLowerCase().includes(q));
   
   const sortedArr = arr.map(p => {
     const ownedCount = recordsList.filter(x => x.holder === p.name || x.swimmer_name === p.name).length;
     return { ...p, ownedCount };
   }).sort((a, b) => b.ownedCount - a.ownedCount);
   
   const peopleEl = document.getElementById("people");
   if(peopleEl) {
     peopleEl.innerHTML = sortedArr.map(p => {
       return `<div class="card person" onclick="openPerson('${esc(p.name)}')"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.gender||"")} · ${esc(p.school||"")}</div><div style="margin-top:12px">🏆 <b>${p.ownedCount}</b> 項隊史紀錄</div></div>`;
     }).join("") || `<div class="empty">找不到符合條件的比賽隊員</div>`;
   }
 } catch(e) {
   console.error("People Render Error:", e);
 }
}

function openPerson(name){
 const p = (state.roster||[]).find(x => x.name === name) || {name};
 const pb = (state.pbs||[]).filter(x => x.name === name || x.swimmer_name === name);
 const rec = (state.records||[]).filter(x => x.holder === name || x.swimmer_name === name);
 
 document.getElementById("personTitle").textContent = `${name}｜個人紀錄`;
 
 const groups = ["長池", "短池"].map(c => {
   const cPbs = pb.filter(x => x.course === c);
   const listHtml = cPbs.length ? cPbs.map(x => `
     <div class="record-row" style="align-items: center;">
       <div>
         <div><b>${esc(x.event)}</b></div>
         ${x.meet ? `<div class="meet-badge" style="margin-top:4px;">${esc(x.meet)}</div>` : ''}
       </div>
       <div style="display:flex;align-items:center;gap:10px;">
         <strong>${esc(x.display || fmt(x.seconds))}</strong>
         ${state.user ? `<button class="btn ghost small-btn" onclick="event.stopPropagation(); openPerformanceModal('${esc(name)}','${esc(c)}','${esc(x.event)}','${x.seconds}','${esc(x.meet||'')}')">✏️ 修改</button>` : ''}
       </div>
     </div>
   `).join("") : "<div class='muted'>尚無成績</div>";
   
   let addBtnHtml = state.user ? `<button class="btn primary small-btn" onclick="event.stopPropagation(); openPerformanceModal('${esc(name)}','${esc(c)}')">＋ 新增成績</button>` : '';

   return `
     <div class="card" style="margin:12px 0">
       <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
         <h3 style="margin:0;">${c} PB</h3>
         ${addBtnHtml}
       </div>
       ${listHtml}
     </div>`;
 }).join("");
 
 const recHtml = rec.length ? `
   <div class="notice">🏆 此選手目前保持 <b>${rec.length}</b> 項隊史紀錄</div>
   ${rec.map(r => `
     <div class="record-row">
       <div>
         <div><b>${esc(r.course)} · ${esc(r.event)}</b></div>${r.meet ? `<div class="meet-badge" style="margin-top:4px;">${esc(r.meet)}</div>` : ''}
       </div>
       <strong>${esc(r.display||fmt(r.seconds))}</strong>
     </div>
   `).join("")}
 ` : "";
 
 document.getElementById("personBody").innerHTML = `
   <div class="card">
     <b>${esc(p.name)}</b>
     <div class="muted">${esc(p.gender||"")} · ${esc(p.school||"")}</div>
   </div>
   ${recHtml}
   ${groups}
 `;
 
 document.getElementById("personModal").classList.add("show");
}

function renderAdmin(){
 const activeSwimmersCount = (state.roster||[]).filter(p => p.name !== "鄧丞勛" && (state.pbs||[]).some(x => x.name === p.name || x.swimmer_name === p.name)).length;
 if(document.getElementById("statPeople")) document.getElementById("statPeople").textContent=activeSwimmersCount;
 if(document.getElementById("statPB")) document.getElementById("statPB").textContent=(state.pbs||[]).length;
 if(document.getElementById("statRecords")) document.getElementById("statRecords").textContent=(state.records||[]).length;
 
 const recentEl = document.getElementById("recent");
 if(recentEl) {
   const sortedPerf = (state.rawPerformances || []).slice().sort((a,b) => new Date(b.created_at || b.swim_date || 0) - new Date(a.created_at || a.swim_date || 0)).slice(0, 5);
   recentEl.innerHTML = sortedPerf.length ? sortedPerf.map(r => `
     <div class="record-row">
       <div>
         <b>${esc(r.swimmer_name)}</b> - ${esc(r.course)} ${esc(r.event)}
         <div class="muted small">${esc(r.meet || '')} ${r.swim_date ? '('+esc(r.swim_date)+')' : ''}</div>
       </div>
       <strong>${esc(fmt(r.seconds))}</strong>
     </div>
   `).join("") : "<div class='muted'>尚無最近更新紀錄。</div>";
 }
}

function openLogin(){document.getElementById("loginModal").classList.add("show")}

function openPerformanceModal(swimmerName, course, event, seconds, meet) {
  if(!state.user) return openLogin();
  fillForms();
  
  if (swimmerName) {
    document.getElementById("pSwimmer").value = swimmerName;
  }
  if (course) {
    document.getElementById("pCourse").value = course;
    fillEvents();
  }
  if (event) {
    document.getElementById("pEvent").value = event;
  }
  if (seconds) {
    document.getElementById("pSeconds").value = seconds;
    document.getElementById("deletePerfBtn").style.display = "block";
  } else {
    document.getElementById("deletePerfBtn").style.display = "none";
  }
  if (meet) {
    document.getElementById("pMeet").value = meet;
  }
  
  document.getElementById("performanceModal").classList.add("show");
}

function closeModal(id){
  document.getElementById(id).classList.remove("show");
}

function fillMeetTags() {
  const meetSelect = document.getElementById("pMeet");
  if (!meetSelect) return;
  const existingMeets = new Set(meetTags);
  (state.pbs || []).forEach(x => { if(x.meet) existingMeets.add(x.meet); });
  (state.records || []).forEach(x => { if(x.meet) existingMeets.add(x.meet); });
  meetTags = Array.from(existingMeets);
  let options = meetTags.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
  options += `<option value="__NEW__">＋ 新增賽事標籤...</option>`;
  meetSelect.innerHTML = options;
  document.getElementById("pMeetCustom").style.display = "none";
}

function checkNewMeet(selectEl) {
  const customInput = document.getElementById("pMeetCustom");
  if (selectEl.value === "__NEW__") {
    customInput.style.display = "block";
    customInput.focus();
  } else {
    customInput.style.display = "none";
  }
}

function fillForms(){
 const activeSwimmers = (state.roster||[]).filter(p => p.name !== "鄧丞勛" && (state.rawPerformances||[]).some(x => x.swimmer_name === p.name));
 document.getElementById("pSwimmer").innerHTML=(activeSwimmers.length ? activeSwimmers : state.roster.filter(p=>p.name!=="鄧丞勛")).map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("");
 document.getElementById("pCourse").onchange=fillEvents; 
 document.getElementById("pCourse").value=state.course; 
 fillEvents();
 fillMeetTags();
 document.getElementById("pDate").value=new Date().toISOString().slice(0,10);
 document.getElementById("pSeconds").value = "";
 document.getElementById("deletePerfBtn").style.display = "none";
 document.getElementById("pMsg").innerHTML = "";
}

function fillEvents(){const c=document.getElementById("pCourse").value;document.getElementById("pEvent").innerHTML=EVENTS[c].map(x=>`<option>${x}</option>`).join("")}

async function login(){
 if(!sb){document.getElementById("loginMsg").innerHTML="<div class='notice error'>尚未設定 Supabase。</div>";return}
 const email=document.getElementById("loginEmail").value,password=document.getElementById("loginPassword").value;
 const {error}=await sb.auth.signInWithPassword({email,password});
 document.getElementById("loginMsg").innerHTML=error?`<div class='notice error'>${esc(error.message)}</div>`:"<div class='notice success'>登入成功</div>";
 if(!error)setTimeout(()=>closeModal("loginModal"),500);
}

async function logout(){if(sb)await sb.auth.signOut();state.user=null;updateAuth();render();}

async function loadCloud(){
 try{
  if(sb) {
    const [{data:sw},{data:perf}]=await Promise.all([
      sb.from("swimmers").select("*").order("name"),
      sb.from("performances").select("*")
    ]);
    if(sw) state.roster = sw.map(x=>({name:x.name,gender:x.gender,school:x.school,grade:x.grade,birth:x.birth,note:x.note}));
    if(perf) {
      state.rawPerformances = perf;
      computeDerivedData(perf.map(x=>({
        swimmer_name: x.swimmer_name,
        course: x.course,
        event: x.event,
        seconds: Number(x.seconds),
        meet: x.meet,
        swim_date: x.swim_date
      })), state.roster);
    }
  } else {
    state.pbs = DEMO_DATA.pbs.filter(x => x.name !== "鄧丞勛");
    state.records = DEMO_DATA.records;
  }
  render();
 }catch(e){console.error(e)}
}

async function submitPerformance(){
 let selectedMeet = document.getElementById("pMeet").value;
 if (selectedMeet === "__NEW__") {
   selectedMeet = document.getElementById("pMeetCustom").value.trim();
   if (selectedMeet && !meetTags.includes(selectedMeet)) {
     meetTags.push(selectedMeet);
   }
 }

 let rawSeconds = document.getElementById("pSeconds").value;
 let secondsVal = parseSeconds(rawSeconds);

 const swimmerName = document.getElementById("pSwimmer").value;
 const course = document.getElementById("pCourse").value;
 const event = document.getElementById("pEvent").value;

 const payload={
   swimmer_name: swimmerName,
   course: course,
   event: event,
   seconds: secondsVal,
   swim_date: document.getElementById("pDate").value,
   meet: selectedMeet,
   note: document.getElementById("pNote").value
 };

 if(!payload.seconds||payload.seconds<=0){document.getElementById("pMsg").innerHTML="<div class='notice error'>請輸入正確秒數或格式。</div>";return}
 if(!sb){document.getElementById("pMsg").innerHTML="<div class='notice error'>尚未連接雲端資料庫。</div>";return}

 const {data: existing} = await sb.from("performances")
   .select("id")
   .eq("swimmer_name", swimmerName)
   .eq("course", course)
   .eq("event", event)
   .maybeSingle();

 let error = null;
 if (existing && existing.id) {
   const res = await sb.from("performances").update(payload).eq("id", existing.id);
   error = res.error;
 } else {
   const res = await sb.from("performances").insert([payload]);
   error = res.error;
 }

 document.getElementById("pMsg").innerHTML=error?`<div class='notice error'>${esc(error.message)}</div>`:`<div class='notice success'>成績儲存成功！</div>`;
 if(!error){
   await loadCloud();
   setTimeout(()=>{
     closeModal("performanceModal");
     const personModal = document.getElementById("personModal");
     if(personModal.classList.contains("show")) {
       openPerson(swimmerName);
     }
   },800);
 }
}

async function deletePerformance() {
  const swimmerName = document.getElementById("pSwimmer").value;
  const course = document.getElementById("pCourse").value;
  const event = document.getElementById("pEvent").value;

  if(!confirm(`確定要刪除「${swimmerName}」的【${course} · ${event}】成績嗎？`)) return;
  if(!sb){document.getElementById("pMsg").innerHTML="<div class='notice error'>尚未連接雲端資料庫。</div>";return}

  const {error} = await sb.from("performances")
    .delete()
    .eq("swimmer_name", swimmerName)
    .eq("course", course)
    .eq("event", event);

  if(error) {
    document.getElementById("pMsg").innerHTML=`<div class='notice error'>刪除失敗：${esc(error.message)}</div>`;
  } else {
    document.getElementById("pMsg").innerHTML=`<div class='notice success'>已成功刪除此筆成績！</div>`;
    await loadCloud();
    setTimeout(()=>{
      closeModal("performanceModal");
      const personModal = document.getElementById("personModal");
      if(personModal.classList.contains("show")) {
        openPerson(swimmerName);
      }
    },800);
  }
}

function exportCSV() {
  try {
    let csvContent = "\uFEFF";
    csvContent += "=== 鬍子泳隊 隊史紀錄 ===\n";
    csvContent += "水道/池型,組別,項目,選手姓名,成績(秒),顯示成績,賽事名稱\n";
    (state.records || []).forEach(r => {
      csvContent += `"${r.course||''}","${r.gender||''}","${r.event||''}","${r.holder||r.swimmer_name||''}","${r.seconds||''}","${r.display||fmt(r.seconds)}","${r.meet||''}"\n`;
    });
    
    csvContent += "\n=== 選手個人最佳紀錄 (PB) ===\n";
    csvContent += "選手姓名,水道/池型,項目,成績(秒),顯示成績,賽事名稱\n";
    (state.pbs || []).forEach(p => {
      csvContent += `"${p.name||p.swimmer_name||''}","${p.course||''}","${p.event||''}","${p.seconds||''}","${p.display||fmt(p.seconds)}","${p.meet||''}"\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const today = new Date().toISOString().slice(0,10);
    link.setAttribute("href", url);
    link.setAttribute("download", `鬍子泳隊_隊史與PB紀錄_${today}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (e) {
    alert("匯出失敗：" + e.message);
  }
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.course=b.dataset.course;render()});
const searchInput = document.getElementById("search");
if(searchInput) searchInput.oninput=renderPeople;

render();updateAuth();
