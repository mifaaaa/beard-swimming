<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鬍子泳隊｜隊史紀錄資料庫</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#102033;--muted:#66758a;--line:#e4e9f0;--accent:#087ea4;--accent2:#075985;--gold:#c58b16;--danger:#b42318;--ok:#16794c;--shadow:0 10px 30px rgba(18,38,63,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
header{background:linear-gradient(135deg,#062f45,#087ea4);color:#fff;padding:24px 18px;position:sticky;top:0;z-index:5;box-shadow:0 5px 18px #0002}
.top{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-weight:900;font-size:22px}.sub{opacity:.78;font-size:12px;margin-top:3px}
button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}.btn{background:#fff;color:#075985}.btn.primary{background:var(--accent);color:#fff}.btn.ghost{background:#eef7fa;color:#075985}.btn.danger{background:#fff0ef;color:var(--danger)}
main{max-width:1180px;margin:0 auto;padding:24px 16px 60px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end;margin:8px 0 22px}.hero h1{font-size:34px;margin:0}.hero p{color:var(--muted);margin:8px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tab{background:#e9eef4;color:#43556b}.tab.active{background:#102f43;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.record-card{position:relative}.record-card .badge{position:absolute;right:14px;top:14px}.badge{background:#fff5d6;color:#916400;border:1px solid #f2d98c;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f4f7fa;color:#52657a;font-size:13px}td strong{font-size:18px}
.searchbar{display:flex;gap:10px;margin:15px 0}.searchbar input{flex:1}.input,select{border:1px solid #d7dee8;background:#fff;border-radius:11px;padding:10px 12px;width:100%}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.person{cursor:pointer}.person:hover{transform:translateY(-2px)}.person h3{margin:0 0 6px}.muted{color:var(--muted)}.stat{font-size:26px;font-weight:900}
.view{display:none}.view.active{display:block}.empty{padding:35px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#071624aa;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;max-width:620px;width:100%;padding:22px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.notice{padding:12px;border-radius:12px;background:#eef8fb;color:#075985;margin:10px 0}.error{background:#fff0ef;color:var(--danger)}.success{background:#ecfdf3;color:var(--ok)}
.admin{display:none}.admin.show{display:block}.small{font-size:12px}.record-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.section-title{font-size:20px;margin:24px 0 12px;display:flex;align-items:center;gap:8px;font-weight:800}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.people{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{display:block}.hero h1{font-size:28px}.grid,.people{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:18px}header{position:relative}}
</style>
</head>
<body>
<header><div class="top">
<div><div class="brand">🏊 鬍子泳隊｜隊史紀錄資料庫</div><div class="sub">公開查詢 · 教練管理 · PB / 隊史自動判定</div></div>
<div id="authArea"><button class="btn" onclick="openLogin()">教練登入</button></div>
</div></header>
<main>
<section class="hero"><div><h1>🏆 隊史紀錄</h1><p>每一秒都值得被記住。速度會變，紀錄會留下。</p></div><div id="dbStatus" class="muted small"></div></section>
<div class="tabs"><button class="tab active" data-course="長池">長池 50m</button><button class="tab" data-course="短池">短池 25m</button></div>

<div id="recordsView"></div>

<section style="margin-top:34px"><div class="hero"><div><h2>👥 隊員資料庫</h2><p>點選有比賽紀錄的隊員查看個人最佳紀錄（PB）與隊史保持項目。</p></div></div>
<div class="searchbar"><input id="search" class="input" placeholder="搜尋姓名、學校…"></div><div id="people" class="people"></div></section>

<section id="adminPanel" class="admin" style="margin-top:40px">
<div class="hero"><div><h2>🔐 教練後台</h2><p>登入後新增成績，系統會自動更新 PB 與隊史判定。</p></div><button class="btn primary" onclick="openPerformance()">＋ 新增成績</button></div>
<div class="grid">
<div class="card"><div class="muted">隊員</div><div class="stat" id="statPeople">—</div></div>
<div class="card"><div class="muted">目前 PB 筆數</div><div class="stat" id="statPB">—</div></div>
<div class="card"><div class="muted">隊史紀錄</div><div class="stat" id="statRecords">—</div></div>
</div>
<div class="card" style="margin-top:14px"><h3>最近更新</h3><div id="recent"></div></div>
</section>
</main>

<div id="loginModal" class="modal"><div class="modalbox">
<div class="modalhead"><h2>教練登入</h2><button onclick="closeModal('loginModal')">✕</button></div>
<label style="margin-top:10px;display:block">Email</label><input id="loginEmail" class="input" type="email" placeholder="coach@example.com">
<label style="display:block;margin-top:10px">密碼</label><input id="loginPassword" class="input" type="password">
<div id="loginMsg"></div><button class="btn primary" style="margin-top:14px;width:100%" onclick="login()">登入</button>
</div></div>

<div id="personModal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="personTitle">隊員</h2><button onclick="closeModal('personModal')">✕</button></div><div id="personBody"></div></div></div>

<div id="performanceModal" class="modal"><div class="modalbox"><div class="modalhead"><h2>新增比賽成績</h2><button onclick="closeModal('performanceModal')">✕</button></div>
<div class="formgrid">
<div><label>隊員</label><select id="pSwimmer"></select></div>
<div><label>泳池</label><select id="pCourse"><option>長池</option><option>短池</option></select></div>
<div><label>項目</label><select id="pEvent"></select></div>
<div><label>成績（秒）</label><input id="pSeconds" class="input" type="number" step="0.01" placeholder="63.74"></div>
<div><label>日期</label><input id="pDate" class="input" type="date"></div>
<div><label>賽事</label><input id="pMeet" class="input" placeholder="例如：2610 泳協北A2"></div>
<div class="full"><label>備註</label><input id="pNote" class="input" placeholder="可選"></div>
</div><div id="pMsg"></div><button class="btn primary" style="margin-top:15px;width:100%" onclick="submitPerformance()">儲存成績</button>
</div></div>

<script src="config.js"></script>
